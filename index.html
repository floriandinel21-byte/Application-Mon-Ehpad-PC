<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EHPAD Suite PC</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
<div class="logo">EHPAD Suite</div>
<nav>
<button class="navbtn" data-tab="dashboard">Dashboard</button>
<button class="navbtn" data-tab="planning">Planning</button>
<button class="navbtn" data-tab="residents">Résidents</button>
<button class="navbtn" data-tab="profil">Profil & Santé</button>
<button class="navbtn" data-tab="fiche">Fiche Médicale</button>
<button class="navbtn" data-tab="direction">Direction</button>
</nav>
</header>

<main>

<section id="dashboard" class="tab active">
<h1>Dashboard</h1>
<div class="card">Bienvenue dans la version PC.</div>
</section>

<section id="planning" class="tab">
<h1>Planning</h1>

<h2>Calendrier mensuel</h2>
<div id="calendar"></div>

<h2>Planning agents</h2>
<table>
<tr><th>Agent</th><th>Matin</th><th>Après‑midi</th><th>Nuit</th></tr>
<tr><td>Dupont</td><td>✔</td><td></td><td></td></tr>
<tr><td>Martin</td><td></td><td>✔</td><td>✔</td></tr>
</table>
</section>

<section id="residents" class="tab">
<h1>Résidents</h1>
<div class="card">Liste des résidents (démo).</div>
</section>

<section id="profil" class="tab">
<h1>Profil & Santé</h1>

<input id="allergyInput" placeholder="Ajouter allergie">
<button onclick="addItem('allergies')">Ajouter</button>
<ul id="allergies"></ul>

<input id="treatInput" placeholder="Ajouter traitement">
<button onclick="addItem('treatments')">Ajouter</button>
<ul id="treatments"></ul>

<input id="diseaseInput" placeholder="Ajouter maladie">
<button onclick="addItem('diseases')">Ajouter</button>
<ul id="diseases"></ul>

<br><br>
<button onclick="saveHealth()">Enregistrer vers fiche médicale</button>

</section>

<section id="fiche" class="tab">
<h1>Fiche Médicale</h1>
<div id="medicalView"></div>
</section>

<section id="direction" class="tab">
<h1>Direction</h1>
<div class="card">Espace direction.</div>
</section>

</main>

<script src="app.js"></script>
</body>
</html>
