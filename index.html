<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EHPAD Suite Pro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="logo">EHPAD Suite Pro</div>
  <nav>
    <button class="navbtn active" data-tab="dashboard">Dashboard</button>
    <button class="navbtn" data-tab="planning">Planning</button>
    <button class="navbtn" data-tab="profil">Profil & Santé</button>
    <button class="navbtn" data-tab="fiche">Fiche Médicale</button>
  </nav>
</header>

<main>

<section id="dashboard" class="tab active">
  <h1>Dashboard</h1>
  <div class="grid">
    <div class="card">👥 Résidents<br><b>24</b></div>
    <div class="card">🧑‍⚕️ Agents<br><b>12</b></div>
    <div class="card">📅 Planning<br><b>OK</b></div>
  </div>
</section>

<section id="planning" class="tab">
  <h1>Planning</h1>
  <div id="calendar"></div>
</section>

<section id="profil" class="tab">
  <h1>Profil & Santé</h1>

  <div class="card">
    <h2>Allergies</h2>
    <input id="allergyInput" placeholder="Ajouter..." />
    <button onclick="addItem('allergies')">+</button>
    <div id="allergies" class="chips"></div>
  </div>

  <div class="card">
    <h2>Traitements</h2>
    <input id="treatInput" placeholder="Ajouter..." />
    <button onclick="addItem('treatments')">+</button>
    <div id="treatments" class="chips"></div>
  </div>

  <div class="card">
    <h2>Maladies</h2>
    <input id="diseaseInput" placeholder="Ajouter..." />
    <button onclick="addItem('diseases')">+</button>
    <div id="diseases" class="chips"></div>
  </div>

  <button class="save" onclick="saveHealth()">Enregistrer</button>

</section>

<section id="fiche" class="tab">
  <h1>Fiche Médicale</h1>
  <div id="medicalView" class="card"></div>
</section>

</main>

<script src="app.js"></script>
</body>
</html>
