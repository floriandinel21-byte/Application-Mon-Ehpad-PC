<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EHPAD PRO</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
<div>EHPAD PRO</div>
<nav>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('planning')">Planning</button>
<button onclick="show('conges')">Congés</button>
<button onclick="show('profil')">Profil & Santé</button>
<button onclick="show('fiche')">Fiche médicale</button>
</nav>
</header>

<main>

<section id="dashboard" class="tab active">
<h1>Dashboard</h1>
<div class="card">Logiciel médical version PRO</div>
</section>

<section id="planning" class="tab">
<h1>Planning</h1>

<input id="agent" placeholder="Nom agent">
<input id="date" type="date">
<select id="shift">
<option>Matin</option>
<option>Après-midi</option>
<option>Nuit</option>
</select>
<button onclick="addPlanning()">Ajouter</button>

<ul id="planningList"></ul>
</section>

<section id="conges" class="tab">
<h1>Demandes</h1>

<input id="nomDemande" placeholder="Nom">
<select id="typeDemande">
<option>Congé</option>
<option>Arrêt maladie</option>
</select>
<input type="date" id="dateDebut">
<input type="date" id="dateFin">
<button onclick="addDemande()">Envoyer</button>

<ul id="demandeList"></ul>
</section>

<section id="profil" class="tab">
<h1>Profil & Santé</h1>

<input id="search" placeholder="Ajouter maladie / allergie / traitement">
<button onclick="addHealth()">Ajouter</button>

<div id="healthList"></div>

<button onclick="saveHealth()">Enregistrer</button>
</section>

<section id="fiche" class="tab">
<h1>Fiche médicale</h1>
<div id="ficheData"></div>
</section>

</main>

<script src="app.js"></script>
</body>
</html>
